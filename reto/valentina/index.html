<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reto Valentina">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️‍♀️</text></svg>">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}</style>
<title>El Reto de Valentina</title>
<meta name="description" content="El reto personal de Valentina: 90 días de gimnasio, comidas y disciplina.">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Estilo deliberadamente claro (blanco + difuminados de color), un solo tema. */
:root{
  --bg:#FFFFFF; --soft:#F8F5FB; --soft2:#F1ECF7; --ink:#1C1330; --muted:#6E6480; --line:#ECE6F2;
  --pink:#FF4F9A; --purple:#7C4DFF; --orange:#FF8A3D; --yellow:#FFC83D; --green:#16A374; --green-soft:#E3F6EF;
  --grad:linear-gradient(120deg,#FF4F9A 0%,#B04CFF 55%,#7C4DFF 100%);
  --grad-warm:linear-gradient(120deg,#FF8A3D 0%,#FF4F9A 100%);
  --glass:rgba(255,255,255,.62); --glass-line:rgba(255,255,255,.85);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --nav-h:68px;
  color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 96px + env(safe-area-inset-bottom,0px))}
.app{max-width:680px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.05;text-wrap:balance;margin:0}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px;border-radius:10px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.gradtext{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ===== difuminados ===== */
.blurbox{position:relative;overflow:hidden;isolation:isolate;border-radius:28px;background:#fff}
.blob{position:absolute;border-radius:50%;filter:blur(38px);opacity:.8;z-index:-1;pointer-events:none}
.b-pink{background:#FF6FAE}.b-purple{background:#9B6BFF}.b-orange{background:#FF9B52}.b-yellow{background:#FFD65C}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(12px,-10px) scale(1.08)}}
.blob{animation:drift 14s ease-in-out infinite}
.blob:nth-child(2){animation-duration:17s;animation-delay:-4s}.blob:nth-child(3){animation-duration:20s;animation-delay:-8s}.blob:nth-child(4){animation-duration:16s;animation-delay:-2s}
.glass{background:var(--glass);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3)}

/* ===== hero ===== */
.hero{margin-top:14px;padding:22px 18px 18px;display:grid;gap:18px}
.hero .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero h1{font-size:clamp(2rem,9vw,3.1rem);font-weight:800;letter-spacing:-.035em}
.hero h1 small{display:block;font-family:var(--body);font-size:.9rem;font-weight:700;letter-spacing:.02em;color:var(--ink);opacity:.75;margin-bottom:6px}
.ring{flex:none;width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1}
.ring .lbl b{font-family:var(--display);font-size:1.8rem;font-weight:800}
.ring .lbl span{font-size:.66rem;font-weight:700;color:var(--muted);margin-top:2px}
.motto{padding:14px 16px;border-radius:18px;display:grid;gap:4px}
.motto p{font-size:1.02rem;font-weight:600}
.motto b{font-family:var(--display);font-size:1.15rem}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:20px;padding:14px;text-align:left;display:grid;gap:4px;min-height:92px;align-content:space-between;border:1px solid var(--glass-line);transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile .ti{font-size:.74rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.tile .tv{font-family:var(--display);font-weight:800;font-size:1.25rem;line-height:1.1}
.tile .ts{font-size:.82rem;color:var(--muted);font-weight:600}
.tile.big{grid-column:1/-1;background:var(--grad);color:#fff;border:0;min-height:112px;box-shadow:0 10px 30px rgba(176,76,255,.28)}
.tile.big .ts{color:rgba(255,255,255,.88)}
.tile.big .go{display:inline-flex;align-items:center;gap:6px;font-weight:800;background:rgba(255,255,255,.22);padding:6px 12px;border-radius:99px;justify-self:start;font-size:.88rem}

/* ===== secciones ===== */
.view{display:grid;gap:16px;padding-top:16px}
.vhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.vhead h2{font-size:1.7rem;font-weight:800;letter-spacing:-.02em}
.daybar{display:flex;align-items:center;gap:8px;justify-content:space-between;background:var(--soft);border-radius:18px;padding:6px}
.daybar button{width:44px;height:44px;border-radius:14px;border:0;background:#fff;font-size:1.1rem;font-weight:800;box-shadow:0 1px 2px rgba(28,19,48,.08)}
.daybar button:disabled{opacity:.35}
.daybar .mid{text-align:center;display:grid;line-height:1.2}
.daybar .mid b{font-family:var(--display);font-size:1.05rem}
.daybar .mid span{font-size:.78rem;color:var(--muted);font-weight:600}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--soft2);color:var(--muted);letter-spacing:.02em}
.chip.pk{background:#FFE4F0;color:#C2185B}.chip.pu{background:#EDE6FF;color:#5B34D6}.chip.or{background:#FFEBDC;color:#C25A12}.chip.gr{background:var(--green-soft);color:var(--green)}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:800;background:var(--soft2);color:var(--ink)}
.btn.main{background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(176,76,255,.25)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.sm{padding:8px 12px;border-radius:12px;font-size:.88rem}
.btn:disabled{opacity:.5}

/* ===== progreso del entreno ===== */
.wprog{padding:16px;display:grid;gap:10px}
.wprog .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.wprog h3{font-size:1.35rem;font-weight:800}
.pbar{height:12px;border-radius:99px;background:rgba(28,19,48,.08);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--grad);transition:width .35s}
.stage{display:grid;gap:10px}
.stage-h{display:flex;align-items:center;gap:10px;margin-top:6px}
.stage-h .n{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#fff;background:var(--grad);flex:none}
.stage-h.done .n{background:var(--green)}
.stage-h h3{font-size:1.15rem;font-weight:800}
.stage-h span{margin-left:auto;font-size:.8rem;font-weight:700;color:var(--muted)}
.check{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:#fff;border:1px solid var(--line);text-align:left;width:100%}
.check .box{width:28px;height:28px;border-radius:9px;border:2px solid #CFC5DC;flex:none;display:grid;place-items:center;transition:all .15s}
.check.on{background:var(--green-soft);border-color:transparent}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box::after{content:"";width:7px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
.check .tx{display:grid;gap:1px;flex:1;min-width:0}
.check .tx b{font-weight:700}
.check .tx span{font-size:.84rem;color:var(--muted)}
.check .tmr{flex:none}
.tmrbtn{border:0;background:var(--soft2);border-radius:12px;padding:8px 10px;font-weight:800;font-size:.84rem;color:var(--purple);white-space:nowrap}
.ex{border:1px solid var(--line);border-radius:20px;padding:12px;display:grid;gap:12px;background:#fff}
.ex.done{border-color:transparent;background:var(--green-soft)}
.ex .hd{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.ex .pic{width:96px;height:74px;border-radius:14px;background:var(--soft);border:0;padding:0}
.ex .pic svg{width:100%;height:100%}
.ex .nm{display:grid;gap:2px;min-width:0}
.ex .nm b{font-family:var(--display);font-size:1.08rem;line-height:1.15}
.ex .nm .dose{font-weight:800;font-size:1.05rem;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;justify-self:start}
.ex .nm .how{border:0;background:none;padding:0;color:var(--purple);font-weight:700;font-size:.86rem;justify-self:start}
.sets{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.set{min-width:52px;height:52px;border-radius:16px;border:2px dashed #D5CBE2;background:#fff;font-weight:800;display:grid;place-items:center;line-height:1;font-size:.95rem;padding:0 10px}
.set small{display:block;font-size:.62rem;font-weight:700;color:var(--muted)}
.set.on{border:2px solid var(--green);background:var(--green);color:#fff}
.set.on small{color:rgba(255,255,255,.85)}
.exfoot{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.kg{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);font-weight:600}
.kg input{width:78px;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;text-align:right;background:#fff;font-weight:700}
.cardio{padding:16px;display:grid;gap:10px}
.cardio .big{font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1}
.celebrate{padding:20px 18px;text-align:center;display:grid;gap:6px}
.celebrate h3{font-size:1.6rem;font-weight:800}
.note{padding:12px 14px;border-radius:16px;background:#FFF6E0;font-size:.92rem}
.info{font-size:.92rem;color:var(--muted)}

.sug{border:0;text-align:left;border-radius:14px;padding:10px 12px;background:linear-gradient(120deg,#FFF1D6,#FFE4F0);font-size:.88rem;font-weight:600;color:var(--ink)}
.sug b{color:#C2185B}
.swap{display:grid;gap:10px;padding:12px;border-radius:16px;background:var(--soft)}
.swap>b{font-size:.9rem}
.alts{display:flex;gap:6px;flex-wrap:wrap}
.alts button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 12px;font-weight:700;font-size:.86rem}
.photo{display:inline-flex;align-items:center;gap:6px;cursor:pointer;text-align:left}
.aicard{display:grid;gap:8px;padding:12px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:.92rem}
.aicard ol,.aicard ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.compare figure{margin:0;border-radius:16px;overflow:hidden;background:var(--soft);position:relative}
.compare img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.compare figcaption{position:absolute;left:8px;bottom:8px;background:rgba(255,255,255,.85);border-radius:99px;padding:3px 10px;font-weight:800;font-size:.78rem}
.phrow{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center;margin-bottom:8px}
.phs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ph{aspect-ratio:3/4;max-width:100%;border-radius:12px;border:1.5px dashed #D5CBE2;background:#fff;display:grid;place-items:center;overflow:hidden;cursor:pointer;font-size:.74rem;font-weight:700;color:var(--muted);text-transform:capitalize}
.ph img{width:100%;height:100%;object-fit:cover}

/* ===== hábitos ===== */
.habits{display:grid;gap:10px}
.water{display:flex;gap:6px;flex-wrap:wrap}
.glass-w{width:34px;height:42px;border:0;padding:0;background:none}
.glass-w svg{width:100%;height:100%}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hrow b{font-weight:700}
.toggle{display:flex;gap:6px}
.toggle button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;font-weight:800}
.toggle button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.auto{font-size:.8rem;font-weight:700}

/* ===== comida ===== */
.sum{padding:18px;display:grid;gap:10px}
.sum .kc{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sum .kc b{font-family:var(--display);font-size:2.6rem;font-weight:800;line-height:1}
.sum .pbar i{background:var(--grad-warm)}
.sum .pbar.over i{background:#E0356B}
.meal{border:1px solid var(--line);border-radius:22px;background:#fff;overflow:hidden}
.meal.eaten{border-color:#BFE9D8}
.meal .mh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px 0}
.meal .mh h3{font-size:1.2rem;font-weight:800}
.car{display:grid;grid-template-columns:40px 1fr 40px;gap:6px;align-items:center;padding:12px 10px 4px;touch-action:pan-y}
.arrow{width:40px;height:40px;border-radius:14px;border:0;background:var(--soft);font-size:1.1rem;font-weight:800;color:var(--purple)}
.opt{display:grid;gap:8px;min-height:120px;align-content:start;animation:fadein .25s}
@keyframes fadein{from{opacity:.2;transform:translateX(6px)}to{opacity:1;transform:none}}
.opt ul{margin:0;padding-left:1.1em;display:grid;gap:3px;font-size:.93rem}
.opt .k{display:flex;gap:8px;flex-wrap:wrap}
.dots{display:flex;gap:6px;justify-content:center;padding:6px 12px 0;flex-wrap:wrap}
.dots button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-weight:800;font-size:.82rem;color:var(--muted)}
.dots button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.dots button.eat{border-color:var(--green);color:var(--green)}
.dots button.eat[aria-pressed="true"]{background:var(--green);color:#fff}
.mact{display:flex;gap:8px;padding:12px 16px 16px;flex-wrap:wrap}
.mact .btn{flex:1}
.custom{display:grid;gap:10px;padding:4px 16px 16px}
.custom textarea{width:100%;min-height:78px;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;resize:vertical;background:#fff}
.custom .est{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.custom label{display:grid;gap:4px;font-size:.78rem;font-weight:700;color:var(--muted)}
.custom input{border:1.5px solid var(--line);border-radius:12px;padding:10px;font-weight:800;font-size:1.05rem;background:#fff}
.estnote{font-size:.84rem;color:var(--muted);min-height:1.2em}
details.acc{border:1px solid var(--line);border-radius:18px;background:#fff}
details.acc summary{list-style:none;padding:14px 16px;font-weight:800;display:flex;justify-content:space-between;cursor:pointer}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";font-size:1.2rem;color:var(--purple)}
details.acc[open] summary::after{content:"–"}
details.acc .in{padding:0 16px 16px;display:grid;gap:10px;font-size:.93rem}
details.acc ul{margin:0;padding-left:1.1em;display:grid;gap:5px}
.calc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.calc label{display:grid;gap:4px;font-size:.76rem;font-weight:700;color:var(--muted)}
.calc input{border:1.5px solid var(--line);border-radius:12px;padding:9px;background:#fff;font-weight:700;width:100%}

/* ===== calendario ===== */
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);font-weight:600}
.legend i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .hd{font-size:.68rem;font-weight:800;color:var(--muted);text-transform:uppercase;text-align:center;letter-spacing:.06em}
.phl{grid-column:1/-1;margin-top:12px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.phl b{font-family:var(--display);font-size:1rem}
.phl span{font-size:.78rem;color:var(--muted)}
.cell{aspect-ratio:1/1.12;max-width:100%;border-radius:14px;border:1px solid var(--line);background:#fff;padding:5px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;position:relative;font-size:.62rem;line-height:1.1;overflow:hidden}
.cell .d{font-family:var(--display);font-weight:800;font-size:1rem}
.cell .lb{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.str .lb{color:#C2185B}.cell.car .lb{color:#C25A12}.cell.rest{background:var(--soft)}.cell.rest .lb{color:var(--muted)}
.cell.mile{background:#FFF3D6;border-color:transparent}.cell.mile .lb{color:#9A6A00}
.cell.done{background:var(--grad);border-color:transparent;color:#fff}.cell.done .lb{color:#fff}
.cell.done::after{content:"✓";position:absolute;top:5px;right:7px;font-weight:800}
.cell.missed{border:1.5px dashed #FF8AB8}
.cell.today{outline:3px solid var(--ink);outline-offset:1px}

/* ===== progreso ===== */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{padding:14px;border-radius:20px;display:grid;gap:2px}
.kpi b{font-family:var(--display);font-size:1.9rem;font-weight:800;line-height:1}
.kpi span{font-size:.8rem;color:var(--muted);font-weight:600}
.weeks{display:grid;grid-template-columns:repeat(13,1fr);gap:4px;align-items:end;height:120px}
.weeks div{display:grid;gap:3px;justify-items:center;height:100%;align-content:end}
.weeks i{display:block;width:100%;background:var(--grad);border-radius:6px 6px 3px 3px;min-height:3px}
.weeks span{font-size:.6rem;color:var(--muted);font-weight:700}
.goal{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.goal:last-child{border:0}
.goal .pbar{grid-column:1/-1;height:9px}
.meas{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.meas input{width:62px;border:1.5px solid var(--line);border-radius:10px;padding:6px;text-align:right;background:#fff}
.good{color:var(--green);font-weight:800}.bad{color:#E0356B;font-weight:800}

/* ===== máquinas ===== */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-weight:800;font-size:.86rem;white-space:nowrap}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.excard{border:1px solid var(--line);background:#fff;border-radius:18px;overflow:hidden;padding:0;text-align:left;display:flex;flex-direction:column}
.excard .p{background:var(--soft);aspect-ratio:4/3;max-width:100%}
.excard .p svg{width:100%;height:100%}
.excard .t{padding:10px 12px;display:grid;gap:2px}
.excard .t b{font-family:var(--display);font-size:.98rem;line-height:1.15}
.excard .t span{font-size:.74rem;color:var(--muted)}

/* ===== fase ===== */
.tl{padding:16px;border-radius:20px;border:1px solid var(--line);background:#fff;display:grid;gap:6px}
.tl .when{font-size:.74rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--purple)}
.tl h3{font-size:1.15rem;font-weight:800}
.tl ul{margin:0;padding-left:1.1em;display:grid;gap:4px;font-size:.92rem}

/* ===== diálogo ===== */
dialog{border:0;border-radius:26px;padding:0;width:calc(100% - 24px);max-width:620px;background:#fff;color:var(--ink);box-shadow:0 20px 60px rgba(28,19,48,.25)}
dialog::backdrop{background:rgba(28,19,48,.45);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.dlg{padding:18px;display:grid;gap:14px;max-height:86vh;overflow:auto}
.dlg .x{justify-self:end;width:40px;height:40px;border-radius:99px;border:0;background:var(--soft2);font-size:1rem}
.dlg .poses{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dlg .poses.one{grid-template-columns:1fr}
.pose{background:var(--soft);border-radius:16px;padding:6px;display:grid;gap:2px}
.pose svg{width:100%;height:auto}
.pose span{font-size:.72rem;font-weight:800;text-align:center;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.dlg h4{margin:0 0 6px;font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.dlg ul,.dlg ol{margin:0;padding-left:1.2em;display:grid;gap:5px;font-size:.94rem}
.dlg a{color:var(--purple);font-weight:800}

/* ===== figuras ===== */
.fig .body{stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round;fill:none}
.fig .b2{opacity:.35}
.fig .head{fill:var(--ink)}
.fig .mach{stroke:#B9AECB;stroke-linecap:round;fill:none}
.fig .machf{fill:#B9AECB}
.fig .mov{stroke:var(--pink);stroke-linecap:round;fill:none}
.fig .movf{fill:var(--pink)}
.fig .floor{stroke:var(--line);stroke-width:2}

/* ===== barra inferior y temporizador ===== */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
nav.bottom .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav.bottom button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:6px 2px;border-radius:14px;font-size:.68rem;font-weight:800;color:var(--muted)}
nav.bottom svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.bottom button[aria-current="page"]{color:var(--ink);background:var(--soft2)}
nav.bottom button[aria-current="page"] svg{stroke:var(--pink)}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom,0px));z-index:21;width:min(420px,calc(100% - 24px));border-radius:22px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;box-shadow:0 12px 30px rgba(28,19,48,.35)}
.timer .tl2{flex:1;min-width:0;display:grid;line-height:1.15}
.timer .tl2 span{font-size:.74rem;opacity:.75;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer .tl2 b{font-family:var(--display);font-size:1.7rem;font-weight:800}
.timer button{border:0;border-radius:14px;height:42px;min-width:42px;padding:0 12px;font-weight:800;background:rgba(255,255,255,.14);color:#fff}
.timer.ding{background:var(--grad)}
@media (min-width:700px){.tiles{grid-template-columns:repeat(3,1fr)}.tile.big{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

    o.list=core;o.cardioFirst=true;}
  if(k==="INF"){o.list=["prensa","goblet","curlfem","extcuad","rumano","aductora"].map(st);o.cardio=tread(POST[w-1]);}
  if(k==="SUP"){o.list=(ph===2?["jalon","remo1","pecho","hombro","facepull","triceps"]:["jalon","remo1","flexinc","hombro","facepull","laterales","triceps"]).map(st);if(ph===2)o.list.push(pl);o.cardio=ell(POST[w-1]);}

  return o;
}
function stepsOf(s){ // lista ordenada de etapas para el modo "hacer"
  const st=[];
  if(s.pre.length) st.push({key:"pre",title:s.k==="DIA1"?"Antes de empezar":s.tone==="rest"||s.k==="EVAL"?"Tu día":"La prueba",items:s.pre});
  if(s.warm.length) st.push({key:"warm",title:"Calentamiento",items:s.warm});
  if(s.cardioFirst&&s.cardio) st.push({key:"cardio",title:"Cardio",cardio:s.cardio});
  if(s.list.length) st.push({key:"ex",title:s.circuit?"Circuito":s.tone==="car"?"Abdomen con máquinas y poleas":"Ejercicios",list:s.list,circuit:s.circuit});
  if(!s.cardioFirst&&s.cardio) st.push({key:"cardio",title:"Cardio final",cardio:s.cardio});
  if(s.cool.length) st.push({key:"cool",title:"Estiramiento",items:s.cool});
  return st;
}

function workProgress(n){
  const s=session(n), x=S.days[n]||{}, steps=x.steps||{}, sets=x.sets||{}; let tot=0,done=0;
  stepsOf(s).forEach(g=>{
    if(g.items) g.items.forEach(i=>{tot++; if(steps[i.id])done++;});
    if(g.cardio){tot++; if(steps.cardio)done++;}
    if(g.list){ if(g.circuit){tot+=g.circuit.rounds; done+=Math.min(g.circuit.rounds,x.rounds||0);}
      else g.list.forEach(b=>{tot+=b.sets; done+=(sets[b.id]||[]).filter(Boolean).length;}); }
  });
  return {tot,done,pct:tot?Math.round(done/tot*100):0};
}
function syncDone(n){const s=session(n); if(!TRAIN(s.k))return; const p=workProgress(n); if(p.tot&&p.done===p.tot) dd(n).done=true;}

function kcal(){const b=10*S.weight+6.25*S.height-5*S.age-161, tdee=b*1.5, goal=Math.max(1400,Math.round(tdee*0.8/50)*50);
  return {tdee:Math.round(tdee/10)*10,goal,prot:Math.round(S.weight*1.7)};}
function mealVal(m,f){ if(!f)return null; if(f.opt==="custom")return {kcal:+f.kcal||0,p:+f.p||0}; const o=m.opts[f.opt]; return o?{kcal:o.kcal,p:o.p}:null; }
function foodDay(n){const F=(S.days[n]&&S.days[n].food)||{}; let kc=0,p=0,c=0; MEALS.forEach(m=>{const v=mealVal(m,F[m.k]); if(v){kc+=v.kcal;p+=v.p;c++;}}); return {kc,p,c};}

const HAB=["done","food","water","sleep","clean"];
function habOk(n,h){const x=S.days[n]||{}; if(h==="water")return (x.water||0)>=8; if(h==="food"){const f=foodDay(n); return f.c>=4&&f.kc<=kcal().goal+150;} return !!x[h];}
function stats(){
  const tn=Math.min(90,todayN()); let sessions=0,done=0,habT=0,habD=0,best=0,run=0;
  for(let n=1;n<=90;n++){if(TRAIN(keyOf(n))){sessions++;if(S.days[n]&&S.days[n].done)done++;}}
  for(let n=1;n<=tn;n++){const k=keyOf(n),x=S.days[n]||{};
    HAB.forEach(h=>{ if(h==="done"&&!TRAIN(k))return; habT++; if(habOk(n,h))habD++; });
    if(TRAIN(k)){ if(x.done){run++;best=Math.max(best,run);} else if(n<tn){run=0;} }}
  return {sessions,done,habPct:habT?Math.round(habD/habT*100):0,streak:run,best,tn};
}

function beep(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(d=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;g.gain.setValueAtTime(.2,AC.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d+.2);o.connect(g).connect(AC.destination);o.start(AC.currentTime+d);o.stop(AC.currentTime+d+.22);});}catch(e){} try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}}
function startTimer(sec,label){ if(!sec)return; try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
  clearInterval(T.iv); T={end:Date.now()+sec*1000,left:sec,paused:false,label,iv:null}; tEl.hidden=false; tEl.classList.remove("ding");
  document.getElementById("tLabel").textContent=label; document.getElementById("tPause").textContent="❚❚"; tick(); T.iv=setInterval(tick,250);}
function tick(){ if(T.paused)return; const s=Math.ceil((T.end-Date.now())/1000); T.left=s; document.getElementById("tTime").textContent=mmss(Math.max(0,s));
  if(s<=0){clearInterval(T.iv);tEl.classList.add("ding");document.getElementById("tLabel").textContent="¡Listo! A la siguiente 💪";beep();setTimeout(()=>{if(tEl.classList.contains("ding"))tEl.hidden=true;},4000);}}

function dayBar(n,onNav){
  const tn=todayN(), rel=n===tn?"Hoy":n===tn+1?"Mañana":n===tn-1?"Ayer":"Día "+n;
  return `<div class="daybar"><button data-nav="-1" ${n<=1?"disabled":""} aria-label="Día anterior">←</button><div class="mid"><b>${rel} · día ${n}</b><span>${fmt(dateOf(n))}</span></div><button data-nav="1" ${n>=90?"disabled":""} aria-label="Día siguiente">→</button></div>`;
}
function bindDayBar(V,render){V.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{SEL=clampDay(SEL+ +b.dataset.nav);render();});}
function checkItem(i,on,label){return `<button class="check ${on?"on":""}" data-step="${i.id}"><span class="box"></span><span class="tx"><b>${i.t}</b><span>${i.d||""}</span></span>${i.sec?`<span class="tmr tmrbtn" data-timer="${i.sec}" data-tl="${esc(i.t)}" role="button" tabindex="0">▶ ${i.sec>=60?Math.round(i.sec/60)+" min":i.sec+" s"}</span>`:""}</button>`;}

 jalon:["remo1","facepull","remo"],remo:["remo1","jalon","facepull"],remo1:["remo","jalon"],facepull:["remo","laterales"],pecho:["flexinc"],flexinc:["pecho"],hombro:["laterales"],laterales:["hombro","facepull"],curlbi:["remo1"],triceps:["flexinc"],
 plancha:["planchalat","pallof","deadbug"],planchalat:["plancha","pallof"],deadbug:["rodillas","crunchpolea","plancha"],crunchpolea:["rodillas","deadbug"],rodillas:["crunchpolea","deadbug"],pallof:["lenador","planchalat"],lenador:["pallof","crunchpolea"]};

let SWAPOPEN=null, IMG=false; const AIOUT={};
const exId=(n,id)=>((S.days[n]&&S.days[n].swap)||{})[id]||id;
function lastInfo(n,eid){ // último día con peso anotado en ese ejercicio y si completó todas las series
  for(let m=n-1;m>=1;m--){const x=S.days[m]; const v=x&&x.kg&&x.kg[eid]; if(!v)continue;
    const it=session(m).list.find(b=>exId(m,b.id)===eid); const done=it&&x.sets?(x.sets[it.id]||[]).filter(Boolean).length:0;
    return {kg:v,day:m,complete:!!it&&it.sets>0&&done>=it.sets};}
  return null;}
function bestKg(eid){let b=0,f=null;for(let m=1;m<=90;m++){const v=S.days[m]&&S.days[m].kg&&S.days[m].kg[eid];if(v){if(f==null)f=v;b=Math.max(b,v);}}return f==null?null:{first:f,best:b};}
function shrink(file,max=1280){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(),"image/jpeg",.85);};img.onerror=()=>{URL.revokeObjectURL(u);rej();};img.src=u;});}
const aiFail=e=>{ if(e&&["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed","images_unavailable"].includes(e.code)){IMG=false;return "Esta vista no puede analizar fotos. Pregunta al instructor.";} return e&&e.code==="rate_limited"?"Demasiadas consultas seguidas. Intenta en un rato.":"No pude analizar la foto. Intenta con otra más clara.";};

  const V=document.getElementById("v-maq"); V.innerHTML=h;
  V.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{EXF=b.dataset.f;renderMaq();});
  V.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>openEx(b.dataset.ex));
}
function openEx(id){
  const e=EX[id], dl=document.getElementById("dlg");
  document.getElementById("dlgBody").innerHTML=`<button class="x" id="dlgX" aria-label="Cerrar">✕</button>
   <div><p class="eyebrow">${e.alias}</p><h2 style="margin-top:4px;font-size:1.6rem">${e.name}</h2></div>
   <div class="poses ${e.B?"":"one"}"><div class="pose">${svgEx(id,"A")}<span>${e.B?"1 · Inicio":"Mantén"}</span></div>${e.B?`<div class="pose">${svgEx(id,"B")}<span>2 · Final</span></div>`:""}</div>
   <div><h4>Cómo se ve</h4><p>${e.looks}</p></div>
   <div><h4>Ajuste</h4><ul>${e.setup.map(s=>`<li>${s}</li>`).join("")}</ul></div>
   <div><h4>Hazlo así</h4><ol>${e.steps.map(s=>`<li>${s}</li>`).join("")}</ol></div>
   <div><h4>Evita</h4><ul>${e.err.map(s=>`<li>${s}</li>`).join("")}</ul></div>
   <div><h4>Respira</h4><p>${e.breath}</p></div>
   <p class="note">${e.tip}</p>
   <p><a href="https://www.youtube.com/results?search_query=${encodeURIComponent(e.q)}" target="_blank" rel="noopener">Ver videos en YouTube ↗</a></p>`;
  dl.showModal(); document.getElementById("dlgX").onclick=()=>dl.close();
}
document.getElementById("dlg").addEventListener("click",e=>{if(e.target.id==="dlg")e.target.close();});

/* ================== QUÉ SIGUE ================== */
function renderFase(){
  document.getElementById("v-fase").innerHTML=`<div class="vhead"><h2>Después del día 90</h2></div>
   <div class="motto blurbox" style="border:1px solid var(--line);padding:18px">${blobs([["purple",-10,-40,160],["pink",60,-30,150],["yellow",30,50,120]])}<p>El cuerpo que quieres (más delgado, tonificado, abdomen plano, sin agrandar la cadera) es realista. El proceso completo toma <b>6 a 9 meses</b>.</p></div>
   <div class="tl"><span class="when">Meses 1–3</span><h3>Este reto</h3><p class="info">Hábito, técnica y primer bloque de pérdida de grasa.</p></div>
   <div class="tl" style="border-color:#FFB6D3;background:#FFF5FA"><span class="when">Semanas 14–15</span><h3>Pausa de dieta</h3><p class="info">2 semanas comiendo lo que gastas (≈ ${kcal().tdee.toLocaleString("es-CO")} kcal) y entrenando igual. Recargas energía antes del siguiente bloque.</p></div>
   <div class="tl"><span class="when">Meses 4–6</span><h3>Definición</h3><ul><li>Otra vez en déficit (recalcula con tu nuevo peso).</li><li>4 días de fuerza + 1 de intervalos.</li><li>4 series de 8–12, subiendo 1–2,5 kg cuando completes todo.</li><li>Entran ejercicios libres: sentadilla con barra, remo con mancuerna, flexiones.</li><li>Cadera: glúteo moderado; nada de hip thrust pesado ni abductores pesados.</li></ul></div>
   <div class="tl"><span class="when">Mes 7 en adelante</span><h3>Mantener</h3><p class="info">Calorías de mantenimiento y 4 entrenos por semana. El músculo sigue definiéndose sin dieta.</p></div>
   <div class="card"><h3>Pasas a la siguiente fase si…</h3><ul style="margin:8px 0 0;padding-left:1.1em;display:grid;gap:4px"><li>Cumpliste al menos el 80 % de los entrenos.</li><li>Dominas la técnica de las máquinas.</li><li>No tienes dolor en rodilla, espalda baja u hombro.</li><li>Bajaron cintura y cadera.</li><li>Si algo falla, repite las semanas 9–12.</li></ul></div>
   <div class="card"><h3>Sobre piernas y cadera</h3><p class="info" style="margin-top:6px">La grasa no se quita de una zona específica; la de piernas y cadera suele irse de última. Lo que funciona: déficit constante, caminata inclinada, piernas con peso moderado y 12–15 repeticiones, y más espalda y hombros para equilibrar la silueta.</p></div>`;
}

/* ================== NAVEGACIÓN ================== */
const R={inicio:renderInicio,entreno:renderEntreno,comida:renderComida,cal:renderCal,prog:renderProg,maq:renderMaq,fase:renderFase};
let CUR="inicio";
function go(v){ if(!R[v])v="inicio"; CUR=v;
  Object.keys(R).forEach(k=>document.getElementById("v-"+k).hidden=k!==v);
  document.querySelectorAll("nav.bottom [data-go]").forEach(b=>{if(b.dataset.go===v)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");});
  R[v](); window.scrollTo({top:0}); try{localStorage.setItem("reto90view",v);}catch(e){} }
function bindGo(root){root.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{ if(b.dataset.go==="entreno"||b.dataset.go==="comida")SEL=clampDay(todayN()); go(b.dataset.go);});}
bindGo(document.querySelector("nav.bottom"));
function boot(){let v="inicio";try{v=localStorage.getItem("reto90view")||"inicio";}catch(e){} go(v);}
boot();
(async()=>{
  if(!window.claude||!window.claude.use)return;
  window.claude.use("sample").then(async s=>{SAMPLE=s||null; if(s){const l=await s.limits().catch(()=>null); IMG=!!(l&&l.images); if(IMG&&CUR==="entreno")renderEntreno();}}).catch(()=>{});
  window.claude.use("assets").then(a=>{ASSETS=a||null; if(a&&CUR==="prog")renderProg();}).catch(()=>{});
  try{ const d=await window.claude.use("db"); if(!d)return; DB=d;
    const snap=await d.doc("progress/main").get();
    if(snap.exists){S=Object.assign(S,JSON.parse(JSON.stringify(snap.data())));SEL=clampDay(todayN());R[CUR]();}
    else persist();
  }catch(e){}
})();

</script>
